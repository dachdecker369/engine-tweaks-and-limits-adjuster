; ============================================================================
; TweaksV.ini - settings for TweaksV.asi (GTA V Enhanced)
; Created automatically the first time the game starts with TweaksV.asi
; installed - in the GTA V Enhanced folder, or in %LOCALAPPDATA%\TweaksV if the
; game folder is read-only (e.g. under C:\Program Files). A TweaksV.ini in the
; game folder always wins. The defaults are the values used by the original
; plugins' source code.
;
; 1 = on, 0 = off (true/false also work). Lines starting with ; are comments.
; Delete this file to get a fresh one with the default values on the next start.
; If a setting is missing, TweaksV adds it back with its default value.
; ============================================================================

[TWEAKSV]
; Master switch. 0 = TweaksV changes nothing (this file is still kept).
ENABLED=1
; Write TweaksV.log (in the game folder, or in %LOCALAPPDATA%\TweaksV if the
; game folder is read-only).
LOG_TO_FILE=1
; Open a console window that shows the log while the game runs.
CONSOLE=0
; Show one message box at start-up if a feature could not be applied.
SHOW_ERROR_POPUPS=1
; Warn about old stand-alone plugins that TweaksV replaces (HeapAdjuster.asi,
; ModkitLimitAdjusterEnhanced.asi, PackfileLimitAdjusterEnhanced.asi,
; RageOpenV.asi, StraightToStoryMode.asi, OpenRPF.asi, OpenIV.asi) and skip the
; matching TweaksV feature while they are present.
CHECK_FOR_CONFLICTS=1
; TESTING: log every memory pattern TweaksV looks for (address, number of
; matches, original bytes). Use after a game update or when reporting a bug.
DIAGNOSTIC_MODE=0
; TESTING: look for everything and log the results, but change nothing in the
; game. Combine with DIAGNOSTIC_MODE=1 to check a new game version safely.
DRY_RUN=0

[HEAP_SETTINGS]
; HeapAdjuster: enlarges the game's memory heap.
ENABLED=1
; Heap size in MB. Default 1024 (from the source). Maximum 2047.
; A value below the game's own size is raised to the game's own size.
HEAP_SIZE=1024

[MODKIT_SETTINGS]
; ModkitLimitAdjuster: raises the vehicle modkit ID limit.
ENABLED=1
; Number of modkit IDs. Default 65536 (from the source). Maximum 65536.
MODKITARRAY_SIZE=65536

[PACKFILE_SETTINGS]
; PackfileLimitAdjuster: raises the number of RPF archives the game can load.
ENABLED=1
; Number of archives. Default 12000 (from the source). Maximum 65535.
PACKFILEARRAY_SIZE=12000

[RAGEOPENV_SETTINGS]
; RageOpenV: replacement for OpenRPF.asi.
ENABLED=1
; Load replacement files from the "mods" folder in the GTA V Enhanced folder.
MODS_FOLDER=1
; Allow unencrypted ("OPEN") RPF archives.
OPEN_RPF=1
; Skip the game's RPF cache check (needed for modified RPFs; set 0 only to test).
SKIP_RPF_CACHE_CHECK=1
; Loose files from the "newmods" folder (experimental upstream feature).
NEWMODS=1
; RageOpenV's log switches (off by default, as in the source). All three are
; verbose - turn them on only while hunting a problem.
; LOG_INFO = status messages and every file request, LOG_MODS = every file
; served from mods\ and every OPEN archive, LOG_DEVICE = the newmods device.
LOG_INFO=0
LOG_MODS=0
LOG_DEVICE=0

[STRAIGHTTOSTORYMODE_SETTINGS]
; StraightToStoryMode: boots straight into Story Mode.
ENABLED=1
SKIP_SPLASH_SCREEN=1
SKIP_LEGAL_SCREEN=1
; Skips the Story Mode / Online choice.
SKIP_LANDING_PAGE=1
