; ============================================================================
; Settings for TweaksV.asi (GTA V Enhanced)
;
; TweaksV.ini in the game folder takes priority over %LOCALAPPDATA%\TweaksV\
;
; 1 = on, 0 = off (true/false also work)
;
; Lines starting with ; are comments
;
; Delete this file to get a fresh one with the default values on the next boot
;
; If a setting is missing, TweaksV adds it back with its default value
; ============================================================================

[TWEAKSV]
ENABLED=1
; Writes TweaksV.log (in the game folder, or in %LOCALAPPDATA%\TweaksV\)
LOG_TO_FILE=1
; Open a console window that shows the log while the game runs
CONSOLE=0
; Show a message box if a feature could not be applied or stops working
SHOW_ERROR_POPUPS=1
; Warn about old stand-alone plugins that TweaksV replaces
CHECK_FOR_CONFLICTS=1
; TESTING ONLY: logs every memory pattern TweaksV looks for
DIAGNOSTIC_MODE=0
; TESTING ONLY: logs everything and turns off game patching
DRY_RUN=0
; The layout of this file - TweaksV keeps it up to date, do not change it
INI_VERSION=1

[HEAP_SETTINGS]
ENABLED=1
; Heap size in MB. Default 2000. Maximum 2047
HEAP_SIZE=2000

[MODKIT_SETTINGS]
ENABLED=1
; Number of modkit IDs. Default 65536. Maximum 65536
MODKITARRAY_SIZE=65536

[PACKFILE_SETTINGS]
ENABLED=1
; Number of archives. Default 13000. Maximum 65535
PACKFILEARRAY_SIZE=13000

[BOXSTREAMER_SETTINGS]
ENABLED=1
; Map boxes one search of the box streamer can return (the game's own list holds 1000 - too few with heavy map mods, whose LODs then go missing). Default 10000. Maximum 100000
TRAVERSAL_LIST_SIZE=10000

[RAGEOPENV_SETTINGS]
ENABLED=1
; Load replacement "mods" folder in the GTA V Enhanced directory
MODS_FOLDER=1
; Allow unencrypted ("OPEN") RPF archives
OPEN_RPF=1
; Skip the game's RPF cache check (needed for modified RPFs; 0 only for testing)
SKIP_RPF_CACHE_CHECK=1
; Loose files from the "newmods" folder (experimental upstream feature)
NEWMODS=0
; RageOpenV log switches
LOG_INFO=0
LOG_MODS=0
LOG_DEVICE=0

[STRAIGHTTOSTORYMODE_SETTINGS]
ENABLED=1
; Skips the Splash Screen
SKIP_SPLASH_SCREEN=1
; Skips the Legal Screen
SKIP_LEGAL_SCREEN=1
; Skips straight into Story Mode
SKIP_LANDING_PAGE=1

[DIRECTSTORAGE_SETTINGS]
ENABLED=1
; DirectStorage may open only the .rpf and .cache files in the game folder, so its other files stay free while the game runs
UNLOCK_FILES=1
; TESTING ONLY: logs the game's DirectStorage calls (changes nothing)
LOG_CALLS=0
; TESTING ONLY: logs every file in the game folder the game opens, and how (changes nothing)
LOG_FILE_OPENS=0
