; ===========================================================================
; TweaksV.asi Configuration File (GTA V Enhanced)
; 1 = on, 0 = off (true/false also work)
; TweaksV.ini in the game folder takes priority over %LOCALAPPDATA%\TweaksV\
; Delete this file to get a fresh one with default values on next game boot
; Missing settings are added back by TweaksV with the default value
; For more details on what each setting does, check the README.md
; ===========================================================================

[TWEAKSV]
ENABLED=1
LOG=1                       //Writes to TweaksV.log
DIAGNOSTIC_MODE=0           //TESTING ONLY: logs patterns, sites and measurements
DRY_RUN=0                   //TESTING ONLY: turns off game patching
CONSOLE=0                   //Console window showing .log while the game is running
ERROR_POPUP=1               //Shows error message popups
CONFLICT_CHECK=1            //Turns off TweaksV parts while other plugins that do the same thing are installed
VERSION=3                   //This file's version - leave this line alone!

[HEAP_ADJUSTER]
ENABLED=1
HEAP_SIZE=2000              //Heap size in MB - Maximum 2047

[MODKIT_LIMIT]
ENABLED=1
MODKITARRAY_SIZE=65536      //Number of modkit IDs - Maximum 65536

[PACKFILE_LIMIT]
ENABLED=1
PACKFILEARRAY_SIZE=13000    //Number of archives - Maximum 65535

[BOXSTREAMER]
ENABLED=1
TRAVERSAL_LIST_SIZE=10000   //Number of map boxes - Maximum 100000

[DECALS]
ENABLED=1
DECALDEFS_SIZE=2048         //Number of decal definitions - Maximum 16384

[RAGEOPENV]
ENABLED=1
MODS_FOLDER=1               //Loads "mods" folder in game directory
OPEN_RPF=1                  //Allows unencrypted ("OPEN") RPF archives
SKIP_RPF_CACHE_CHECK=1      //Skips game RPF cache check

[STRAIGHTTOSTORYMODE]
ENABLED=1
SKIP_SPLASH_SCREEN=1        //Skips Splash Screen
SKIP_LEGAL_SCREEN=1         //Skips Legal Screen
SKIP_LANDING_PAGE=1         //Skips Landing Page

[DIRECTSTORAGE]
ENABLED=1
UNLOCK_FILES=1              //Keeps game directory files writable (not .rpf/.cache)

[BLIPS]
ENABLED=1
ACTIVE_BLIP_LIMIT=1900      //Number of map blips before the game stops adding its own - Maximum 1997
